# ASSISTRAN on-prem stack: MariaDB + LiveKit (SFU+TURN) + app + Caddy (TLS).
# Run from the deploy/ directory:  docker compose up -d --build
# Values come from ../.env (see ../.env.example) plus the overrides below.

services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-assistran}
      MARIADB_USER: ${DB_USER:-assistran}
      MARIADB_PASSWORD: ${DB_PASSWORD:-assistran}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-this-root-pw}
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 12

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    # For best media connectivity, host networking is recommended. If you prefer
    # bridged networking (below), keep the UDP range small and open it in the firewall.
    ports:
      - '7880:7880' # signaling (ws) — Caddy terminates TLS in front of this
      - '7881:7881' # rtc over tcp (fallback)
      - '3478:3478/udp' # embedded TURN (udp)
      - '50000-50100:50000-50100/udp' # rtc media (udp)

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # Override so the app reaches MariaDB by its service name inside the network.
      DB_HOST: mariadb
    depends_on:
      mariadb:
        condition: service_healthy
    expose:
      - '3000'

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '443:443' # the app (SPA + /api + /socket.io) over HTTPS
      - '7443:7443' # LiveKit signaling over WSS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy-data:/data
    depends_on:
      - app
      - livekit

volumes:
  mariadb-data:
  caddy-data:
