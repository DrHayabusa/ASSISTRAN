; Programs for the all-in-one container. Included by /etc/supervisor/supervisord.conf
; (which is launched with `supervisord -n`). All logs go to the container stdout/stderr.

[program:mariadb]
command=/usr/sbin/mariadbd --user=mysql --datadir=/var/lib/mysql --bind-address=127.0.0.1 --port=3306 --init-file=/etc/mysql/assistran-init.sql
autostart=true
autorestart=true
priority=10
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:redis]
command=/usr/bin/redis-server --bind 127.0.0.1 --port 6379 --save ""
autostart=true
autorestart=true
priority=10
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; The backend retries the DB connection on startup, so it tolerates MariaDB
; finishing its boot a few seconds later.
[program:backend]
command=/usr/bin/node /app/backend/dist/index.js
directory=/app/backend
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
